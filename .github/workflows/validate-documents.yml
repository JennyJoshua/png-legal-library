name: Validate PNG Legal Library

on:
  push:
    branches:
      - main
    paths:
      - 'data/documents.json'
      - 'data/document-versions.json'
      - 'data/legal-resources.json'
      - 'data/legal-resource-review-queue.json'
      - 'schemas/document.schema.json'
      - 'schemas/document-versions.schema.json'
      - 'schemas/legal-resources.schema.json'
      - 'schemas/legal-resource-review-queue.schema.json'
      - 'schemas/source-registry.schema.json'
      - 'sources/discovery-sources.yml'
      - 'scripts/validate_documents.py'
      - 'scripts/intake_document.py'
      - 'tests/test_document_intake.py'
      - '.github/workflows/validate-documents.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'data/documents.json'
      - 'data/document-versions.json'
      - 'data/legal-resources.json'
      - 'data/legal-resource-review-queue.json'
      - 'schemas/document.schema.json'
      - 'schemas/document-versions.schema.json'
      - 'schemas/legal-resources.schema.json'
      - 'schemas/legal-resource-review-queue.schema.json'
      - 'schemas/source-registry.schema.json'
      - 'sources/discovery-sources.yml'
      - 'scripts/validate_documents.py'
      - 'scripts/intake_document.py'
      - 'tests/test_document_intake.py'
      - '.github/workflows/validate-documents.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Legal Catalogues and Review Queue
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install "jsonschema>=4.20,<5" "PyYAML>=6,<7"

      - name: Run document intake and version tests
        run: python -m unittest discover -s tests -v

      - name: Validate all legal registers
        run: python scripts/validate_documents.py