name: Validate PNG Legal Library

on:
  push:
    branches:
      - main
    paths:
      - 'data/documents.json'
      - 'data/legal-resources.json'
      - 'schemas/document.schema.json'
      - 'schemas/legal-resources.schema.json'
      - 'scripts/validate_documents.py'
      - '.github/workflows/validate-documents.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'data/documents.json'
      - 'data/legal-resources.json'
      - 'schemas/document.schema.json'
      - 'schemas/legal-resources.schema.json'
      - 'scripts/validate_documents.py'
      - '.github/workflows/validate-documents.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Legal Catalogues
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install "jsonschema>=4.20,<5"

      - name: Validate document register and resources catalogue
        run: python scripts/validate_documents.py
