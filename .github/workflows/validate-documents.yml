name: Validate PNG Legal Library

on:
  push:
    branches:
      - main
      - phase3/document-processing
      - phase4/segmentation-and-search
      - phase9/security-legal-safeguards
      - phase10/legal-corpus-foundation
    paths:
      - 'data/documents.json'
      - 'data/document-versions.json'
      - 'data/legal-resources.json'
      - 'data/legal-resource-review-queue.json'
      - 'schemas/document.schema.json'
      - 'schemas/document-versions.schema.json'
      - 'schemas/legal-resources.schema.json'
      - 'schemas/legal-resource-review-queue.schema.json'
      - 'schemas/source-registry.schema.json'
      - 'sources/discovery-sources.yml'
      - 'scripts/validate_documents.py'
      - 'scripts/intake_document.py'
      - 'scripts/extract_document.py'
      - 'docs/legal-segmentation-and-search.md'
      - 'tests/test_legal_search.py'
      - 'schemas/legal-search-index.schema.json'
      - 'scripts/search_legal_index.py'
      - 'scripts/build_legal_index.py'
      - 'scripts/segment_legal_text.py'
      - 'requirements-processing.txt'
      - 'schemas/extraction-result.schema.json'
      - 'tests/test_document_intake.py'
      - 'tests/test_document_extraction.py'
      - 'docs/document-processing.md'
      - 'README.md'
      - '.gitignore'
      - 'scripts/legal_research_agent.py'
      - 'scripts/retrieve_legal_evidence.py'
      - 'scripts/legal_qa.py'
      - 'web/index.html'
      - 'tests/test_legal_evidence_retrieval.py'
      - 'tests/test_legal_research_agent.py'
      - 'tests/test_legal_qa.py'
      - 'tests/test_static_portal.py'
      - 'docs/security-and-legal-safeguards.md'
      - 'docs/constitutional-amendment-register.md'
      - 'docs/legal-source-review-register.md'
      - 'docs/legal-corpus-foundation.md'
      - 'docs/legal-library-portal.md'
      - 'docs/legal-qa-citations.md'
      - 'docs/legal-research-agent.md'
      - 'scripts/discover-legal-sources.py'
      - 'scripts/merge-discovery-review-queue.py'
      - 'tests/test_discovery_reliability.py'
      - '.github/workflows/discover-legal-sources.yml'
      - '.github/workflows/validate-documents.yml'

  pull_request:
    branches:
      - main
      - phase10/legal-corpus-foundation
    paths:
      - 'data/documents.json'
      - 'data/document-versions.json'
      - 'data/legal-resources.json'
      - 'data/legal-resource-review-queue.json'
      - 'schemas/document.schema.json'
      - 'schemas/document-versions.schema.json'
      - 'schemas/legal-resources.schema.json'
      - 'schemas/legal-resource-review-queue.schema.json'
      - 'schemas/source-registry.schema.json'
      - 'sources/discovery-sources.yml'
      - 'scripts/validate_documents.py'
      - 'scripts/intake_document.py'
      - 'scripts/extract_document.py'
      - 'docs/legal-segmentation-and-search.md'
      - 'tests/test_legal_search.py'
      - 'schemas/legal-search-index.schema.json'
      - 'scripts/search_legal_index.py'
      - 'scripts/build_legal_index.py'
      - 'scripts/segment_legal_text.py'
      - 'requirements-processing.txt'
      - 'schemas/extraction-result.schema.json'
      - 'tests/test_document_intake.py'
      - 'tests/test_document_extraction.py'
      - 'docs/document-processing.md'
      - 'README.md'
      - '.gitignore'
      - '.github/workflows/validate-documents.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Legal Catalogues and Review Queue
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation and extraction dependencies
        run: |
          python -m pip install "jsonschema>=4.20,<5" "PyYAML>=6,<7"
          python -m pip install -r requirements-processing.txt

      - name: Run document intake and version tests
        run: python -m unittest discover -s tests -v

      - name: Validate all legal registers
        run: python scripts/validate_documents.py