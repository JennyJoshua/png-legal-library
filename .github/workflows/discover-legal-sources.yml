name: Discover PNG legal sources

on:
  workflow_dispatch:

  schedule:
    # Weekly, Tuesday 19:30 UTC (Wednesday morning in PNG).
    - cron: "30 19 * * 2"

  push:
    branches: [main]
    paths:
      - "sources/discovery-sources.yml"
      - "scripts/discover-legal-sources.py"
      - "scripts/merge-discovery-review-queue.py"
      - ".github/workflows/discover-legal-sources.yml"

# Discovery produces review artifacts only. It must never push to main.
permissions:
  contents: read

jobs:
  discover:
    name: Discover and Queue Legal Resources
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      PNG_DISCOVERY_REQUEST_TIMEOUT: "6"
      PNG_DISCOVERY_MAX_URLS_PER_SOURCE: "40"
      PNG_DISCOVERY_MAX_METADATA_CHECKS: "12"
      PNG_DISCOVERY_MAX_SITEMAPS: "5"
      PNG_DISCOVERY_MAX_SITEMAP_DEPTH: "2"
      PNG_DISCOVERY_MAX_SITEMAP_URLS: "500"
      PNG_DISCOVERY_SOURCE_BUDGET_SECONDS: "75"
      PNG_DISCOVERY_RUN_BUDGET_SECONDS: "480"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install required dependencies
        run: |
          python -m pip install --disable-pip-version-check PyYAML "jsonschema>=4.20,<5"

      - name: Discover candidate legal resources
        run: python scripts/discover-legal-sources.py

      - name: Merge discoveries into a temporary human-review queue
        run: python scripts/merge-discovery-review-queue.py

      - name: Validate legal registers and review queue
        run: python scripts/validate_documents.py

      - name: Upload discovery and review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovered-legal-source-review-package
          path: |
            reports/discovered-source-candidates.json
            data/legal-resource-review-queue.json
          if-no-files-found: warn
          retention-days: 30

      - name: Explain review-only output
        if: always()
        run: |
          echo "Discovery output is available as a workflow artifact."
          echo "No files were pushed to main and no legal material was auto-approved."
