name: Discover PNG legal sources

on:
  workflow_dispatch:

  schedule:
    # Weekly, Tuesday 19:30 UTC (Wednesday morning in PNG).
    - cron: "30 19 * * 2"

  push:
    branches: [main]
    paths:
      - "sources/discovery-sources.yml"
      - "scripts/discover-legal-sources.py"
      - "scripts/merge-discovery-review-queue.py"
      - ".github/workflows/discover-legal-sources.yml"

permissions:
  contents: write

jobs:
  discover:
    name: Discover and Queue Legal Resources
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install required dependencies
        run: |
          python -m pip install PyYAML "jsonschema>=4.20,<5"

      - name: Discover candidate legal resources
        run: python scripts/discover-legal-sources.py

      - name: Merge discoveries into human-review queue
        run: python scripts/merge-discovery-review-queue.py

      - name: Validate legal registers and review queue
        run: python scripts/validate_documents.py

      - name: Save updated review queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/legal-resource-review-queue.json

          if git diff --cached --quiet; then
            echo "Review queue has no changes to commit."
          else
            git commit -m "Update discovered legal resource review queue"
            git push origin HEAD:main
          fi

      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovered-legal-source-candidates
          path: reports/discovered-source-candidates.json
          if-no-files-found: warn
          retention-days: 30
