name: Discover PNG legal sources

on:
  workflow_dispatch:

  schedule:
    # Weekly, Tuesday 19:30 UTC (Wednesday morning in PNG).
    - cron: "30 19 * * 2"

  push:
    branches: [main]
    paths:
      - "sources/discovery-sources.yml"
      - "scripts/discover_legal_sources.py"
      - ".github/workflows/discover-legal-sources.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install PyYAML

      - name: Discover candidate legal sources
        run: python scripts/discover_legal_sources.py

      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovered-legal-source-candidates
          path: reports/discovered-source-candidates.json
          if-no-files-found: warn
          retention-days: 30
